name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Lint, Test, Build & E2E Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Static Analysis & Lint
        run: npm run lint

      - name: Unit & Regression Tests
        run: npm test -- --run

      - name: Production Build
        run: npm run build

      - name: Smoke Verification
        run: npm run smoke

      - name: Economy & Early Game Balance
        run: npm run balance

      - name: Deterministic Simulation Benchmark
        run: npm run benchmark

      - name: Real Browser E2E Tests
        run: npx playwright test
